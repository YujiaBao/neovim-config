# =============================================================================
# General
# =============================================================================

# Use tmux-256color (not xterm-256color) for proper italics & terminfo inside tmux
# Requires the tmux-256color terminfo entry: `brew install ncurses` or distro equivalent
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # enable true color passthrough

# Reduce escape-time so Vim/Neovim doesn't lag on <Esc>
set -sg escape-time 10

# Pass focus events through to apps (needed for Vim's autoread, etc.)
set -g focus-events on

# Start window and pane numbering at 1 (easier keyboard reach)
set -g base-index 1
set -w pane-base-index 1

# Re-number windows when one is closed
set -g renumber-windows on

# Prevent tmux from renaming windows automatically
set -g allow-rename off

# Larger scrollback buffer
set -g history-limit 50000

# Keep the environment in sync when attaching
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# Enable mouse support
set -g mouse on


# =============================================================================
# Key Bindings
# =============================================================================

# Prefix remains C-b (default). Uncomment below to change to C-a:
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Clear screen (since C-l is remapped below)
bind C-l send-keys 'C-l'

# Smart pane switching — aware of Vim splits (vim-tmux-navigator)
# https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

# Pane resizing (prefix + H/J/K/L — uppercase to avoid nav conflicts)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Larger jumps with shift-variants aren't easily bindable; use repeat (-r) + hold instead

# Split panes, preserving current path
unbind '"'
unbind %
bind \\ split-window -h -c '#{pane_current_path}'  # horizontal split
bind -  split-window -v -c '#{pane_current_path}'  # vertical split

# New window in current path
bind c new-window -c '#{pane_current_path}'

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"


# =============================================================================
# Status Bar
# =============================================================================

set -g status on
set -g status-justify centre
set -g status-interval 15

# Activity alerts
set -w monitor-activity on
set -g visual-activity on

# Colors — colour235 ≈ dark gray bg, colour236 ≈ slightly lighter gray
set -g  status-bg colour235
set -g  status-fg green
set -w  window-status-current-style  fg=brightred

# Left: hostname + local IPs (no external curl — avoids slow/offline hangs)
set -g status-left-length 70
set -g status-left "#[fg=green]  #h  #[fg=brightblue]#(ifconfig en0 2>/dev/null | awk '/inet /{print \"en0 \" $2}') #(ifconfig en1 2>/dev/null | awk '/inet /{print \"en1 \" $2}') #(ifconfig tun0 2>/dev/null | awk '/inet /{print \"vpn \" $2}')"

# Right: session, window/pane, date, time
set -g status-right-length 60
#set -g status-right "#[fg=black]#S #I:#P | %d %b %Y | #(TZ=America/Los_Angeles date +'%I:%M %p')"
set -g status-right "#[fg=green]#S #I:#P | %d %b %Y | #(TZ='America/Los_Angeles' date +'%%I:%%M %%p')"


